[package]
name = "sni-fake-engine"
version = "1.1.0"
edition = "2021"
description = "Privileged SNI-spoofing forwarder for sni-fake"

[lib]
name = "sni_fake_engine"
path = "src/lib.rs"

[[bin]]
name = "sni-fake-engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["net", "socket"] }
