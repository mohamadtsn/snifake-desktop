# Cuts a release from a version tag.
#
#   npm run version:set 2.1.0
#   git commit -am "chore: 🔖 v2.1.0" && git tag v2.1.0 && git push --follow-tags
#
# Builds every platform in parallel, uploads the installers to a DRAFT
# GitHub release, and writes the latest.json the in-app updater reads.
# The draft is deliberate: publishing it is the act that makes the update
# visible to everyone already running the app, and that should be a human
# decision made after downloading one bundle and opening it.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

jobs:
  # Fails the release before any 20-minute build starts if the tag and the
  # manifests disagree.
  verify-version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          [ "$tag" = "$pkg" ] || {
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          }
          node scripts/set-version.mjs --check
        if: startsWith(github.ref, 'refs/tags/')

  build:
    needs: verify-version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest      # Apple silicon
            args: --target aarch64-apple-darwin
          - platform: macos-latest      # Intel
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04      # deb + rpm + AppImage
            args: ''
          - platform: windows-latest    # NSIS + MSI
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils \
            rpm

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Only the mac runner cross-compiles; asking for these elsewhere
          # just slows the job down.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update artifacts. Without these two the bundles still
          # build, but latest.json carries no signature and the in-app
          # updater refuses them.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Snifake v__VERSION__
          releaseBody: |
            See [CHANGELOG.md](https://github.com/mohamadtsn/snifake-desktop/blob/main/CHANGELOG.md) for what changed.

            | Platform | Download |
            | --- | --- |
            | Windows | `.exe` (NSIS) or `.msi` |
            | macOS | `.dmg` — Apple silicon (`aarch64`) or Intel (`x64`) |
            | Linux | `.AppImage`, `.deb` or `.rpm` |

            Snifake is unsigned. Windows SmartScreen needs *More info → Run anyway*;
            macOS needs a right-click → *Open* on the first launch.
          releaseDraft: true
          prerelease: false
          # Writes latest.json next to the installers — the file the app's
          # updater endpoint points at.
          includeUpdaterJson: true
          args: ${{ matrix.args }}
