[workspace]
members = ["engine"]

[package]
name = "snifake"
version = "2.3.0"
description = "Desktop app for the Snifake TLS SNI-spoofing engine"
authors = ["Mohamad Tsn"]
license = "MIT"
repository = "https://github.com/mohamadtsn/snifake-desktop"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is what `app.macOSPrivateApi` in tauri.conf.json
# requires; the build script refuses the config without it. It is what makes
# a transparent window possible on macOS, which is what gives the frame its
# rounded corners there.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
which = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
snifake-engine = { path = "engine" }
# Only to *validate* a `regex:` rule line at save time. Rejecting a bad
# pattern in the editor beats sing-box refusing the whole config at start,
# when the user is three screens away from the line they typed.
regex = "1"
# Share links carry percent-encoded credentials and can carry a bracketed
# IPv6 authority. Hand-rolling that split is how subtle bugs get into
# credential handling.
url = "2"
percent-encoding = "2"
# Core acquisition: the archive digest is checked before anything is
# unpacked, and the extracted binary's digest before it is ever executed.
sha2 = "0.10"
# rustls rather than the system TLS stack: this binary already ships a
# pinned trust story, and a download that fails on one distribution's
# OpenSSL is a download the audience cannot retry.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"

# Desktop-only: in-app updates from GitHub Releases, and the relaunch that
# follows one.
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# The file picker behind "Import a file" on the core setup screen.
tauri-plugin-dialog = "2"
# Preferences > General > "Launch at Login". Desktop-only by definition.
tauri-plugin-autostart = "2"
# About's two links. The JS side was already a dependency; the Rust half was
# missing, so calling it would have failed at runtime.
tauri-plugin-opener = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
flate2 = "1"
tar = "0.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
zip = { version = "2", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  # SHELLEXECUTEINFOW carries an HKEY, so windows-sys gates it on Registry.
  "Win32_System_Registry",
  "Win32_System_Threading",
  # InternetSetOptionW, which is what makes a written proxy value take
  # effect in applications that are already running.
  "Win32_Networking_WinInet",
] }

