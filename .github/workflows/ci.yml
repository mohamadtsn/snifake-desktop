# Every push and PR: the checks that must pass before a tag is worth cutting.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # The three manifests carrying a version must agree before anything
      # else runs — a release that fails this fails after 20 minutes of
      # cross-platform builds instead.
      - run: npm run version:check
      - run: npm run build
      - run: npm test

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: install linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      # tauri::generate_context! needs the frontend dist to exist, so the
      # Rust job has to build the frontend even though it never runs it.
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci && npm run build
      # Not `-D warnings`: the tree carries ~10 pre-existing lints and a
      # gate that fails on day one just gets disabled. Tighten this once
      # they are cleaned up.
      - run: cargo clippy --workspace --all-targets
        working-directory: src-tauri
      - run: cargo test --workspace
        working-directory: src-tauri
