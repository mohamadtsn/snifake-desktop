[package]
name = "snifake-engine"
version = "2.4.0"
edition = "2021"
description = "Privileged SNI-spoofing forwarder for Snifake"

[lib]
name = "snifake_engine"
path = "src/lib.rs"

[[bin]]
name = "snifake-engine"
path = "src/main.rs"

[[bin]]
name = "wfp-probe"
path = "src/bin/wfp-probe.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The privileged half hashes the core binary before executing it. The pin
# it compares against lives in this crate for the same reason.
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["net", "socket"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_NetworkManagement_WindowsFilteringPlatform",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_System_Rpc",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Memory",
] }

