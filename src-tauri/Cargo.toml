[workspace]
members = ["engine"]

[package]
name = "snifake"
version = "2.0.6"
description = "Desktop app for the Snifake TLS SNI-spoofing engine"
authors = ["Mohamad Tsn"]
license = "MIT"
repository = "https://github.com/mohamadtsn/snifake-desktop"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
which = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
snifake-engine = { path = "engine" }

# Desktop-only: in-app updates from GitHub Releases, and the relaunch that
# follows one.
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  # SHELLEXECUTEINFOW carries an HKEY, so windows-sys gates it on Registry.
  "Win32_System_Registry",
  "Win32_System_Threading",
] }

